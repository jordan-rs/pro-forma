`,Ya=`/* ─── GRID AREA ASSIGNMENTS (shared across all layouts) ─── */
.c-header    { grid-area: header; }
.c-headline  { grid-area: headline; }
.c-summary   { grid-area: summary; }
.c-funnel    { grid-area: funnel; }
.c-chart     { grid-area: chart; }
.c-scenarios { grid-area: scenarios; }
.c-position  { grid-area: position; }
.c-execution { grid-area: execution; }
.c-footer    { grid-area: footer; }

/* ─── LAYOUT: STACK ─── */
.layout-stack .pf-sheet-main {
  display: flex;
  flex-direction: column;
  padding: 36px 40px;
  gap: var(--gap);
}

/* ─── LAYOUT: HERO-GRID ─── */
.layout-grid .pf-sheet-main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-areas:
    "header    header"
    "headline  headline"
    "summary   summary"
    "funnel    funnel"
    "chart     chart"
    "position  scenarios"
    "execution execution"
    "footer    footer";
  padding: 36px 40px;
  gap: var(--gap);
}

/* ─── LAYOUT: MAGAZINE ─── */
.layout-mag .pf-sheet-main {
  display: grid;
  grid-template-columns: 1.45fr 1fr;
  grid-template-areas:
    "header    header"
    "headline  headline"
    "summary   summary"
    "funnel    funnel"
    "chart     scenarios"
    "position  position"
    "execution execution"
    "footer    footer";
  padding: 36px 40px;
  gap: var(--gap);
}

/* ─── LAYOUT: BRIEFING ─── */
.layout-brief .pf-sheet-main {
  display: grid;
  grid-template-columns: 1fr 1.55fr 1fr;
  grid-template-areas:
    "header    header    header"
    "headline  headline  headline"
    "summary   summary   summary"
    "funnel    funnel    funnel"
    "position  chart     scenarios"
    "execution execution execution"
    "footer    footer    footer";
  padding: 32px 34px;
  gap: var(--gap);
}

/* ─── BRUTALIST OVERRIDES ─── */
.style-brutalist .pf-sheet-main {
  padding: 0 !important;
  gap: 0 !important;
}
.style-brutalist .c-header,
.style-brutalist .c-headline {
  padding: 20px 24px;
}
`,Xa=`/* ─── SHEET ROOT ─── */
.pf-sheet {
  max-width: 1120px;
  margin: 0 auto;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body-font);
  transition: background 0.2s;
}
.pf-sheet * { font-family: inherit; }

/* ─── HEADER ─── */
.c-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 0 10px;
  border-bottom: var(--rule-width) solid var(--rule-2);
  font-family: var(--mono-font);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-2);
}
.c-header .left, .c-header .right { display: flex; gap: 18px; }
.c-header .a { color: var(--accent); }

.style-modernist .c-header {
  background: var(--accent);
  color: var(--bg);
  padding: 8px 14px;
  border: none;
}
.style-modernist .c-header .a { color: var(--bg); font-weight: 700; }
.style-institutional .c-header {
  border-bottom: 1px solid var(--accent);
  padding-bottom: 10px;
  color: var(--fg-2);
}
.style-institutional .c-header .a { color: var(--accent); }
.style-brutalist .c-header {
  background: var(--fg);
  color: var(--bg);
  border-bottom: 3px solid var(--accent);
}
.style-brutalist .c-header .a { color: var(--accent); font-weight: 600; }

/* ─── HEADLINE ─── */
.c-headline h1 {
  font-family: var(--display-font);
  font-weight: var(--display-weight);
  font-style: var(--display-italic);
  letter-spacing: var(--display-tracking);
  color: var(--fg);
  margin: 0 0 14px;
  line-height: 0.98;
}
.style-terminal  .c-headline h1 { font-size: 50px; font-variation-settings: 'opsz' 96, 'wght' 400; }
.style-editorial .c-headline h1 { font-size: 56px; font-variation-settings: 'opsz' 72, 'wght' 300; }
.style-modernist .c-headline h1 { font-size: 64px; line-height: 0.92; text-transform: uppercase; }
.style-institutional .c-headline h1 { font-size: 64px; line-height: 1; font-weight: 500; font-style: italic; }
.style-brutalist .c-headline h1 { font-size: 80px; line-height: 0.88; text-transform: uppercase; }
.c-headline h1 .ac { color: var(--accent); }
.c-headline .deck {
  font-family: var(--body-font);
  font-size: 13px;
  line-height: 1.6;
  color: var(--fg-2);
  max-width: 720px;
}
.style-editorial .c-headline .deck { font-family: var(--display-font); font-size: 17px; font-style: italic; font-weight: 350; }
.style-institutional .c-headline .deck { font-family: var(--display-font); font-size: 17px; font-style: italic; color: var(--fg); max-width: 760px; }
.style-modernist .c-headline .deck { font-weight: 500; color: var(--fg); border-top: var(--rule-width) solid var(--rule); padding-top: 12px; margin-top: 16px; max-width: none; }
.style-brutalist .c-headline .deck { font-family: var(--mono-font); font-size: 12px; color: var(--fg); border-top: 2px solid var(--fg); padding-top: 12px; margin-top: 16px; max-width: none; letter-spacing: 0.02em; }

/* ─── SUMMARY CARDS ─── */
.c-summary {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--gap);
}
.style-brutalist .c-summary { gap: 0; }
.style-brutalist .c-summary .card { border-right-width: 0; }
.style-brutalist .c-summary .card:last-child { border-right-width: 3px; }

.c-summary .card {
  background: var(--bg-2);
  border: var(--rule-width) solid var(--rule);
  padding: var(--pad);
  display: flex;
  flex-direction: column;
}
.style-modernist .c-summary .card { background: var(--bg); }
.style-brutalist .c-summary .card { background: var(--bg-2); border-width: 3px; }
.c-summary .card.focal { background: var(--accent); border-color: var(--accent); }

.c-summary .card .lab {
  font-family: var(--mono-font);
  font-size: 9.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: 14px;
}
.c-summary .card.focal .lab { color: var(--bg); opacity: 0.75; }
.style-modernist .c-summary .card.focal .lab,
.style-brutalist .c-summary .card.focal .lab { color: var(--bg); opacity: 1; }

.c-summary .card .num {
  font-family: var(--display-font);
  font-weight: var(--display-weight);
  font-style: var(--display-italic);
  line-height: 0.95;
  letter-spacing: -0.03em;
  color: var(--fg);
  margin-bottom: 12px;
}
.c-summary .card.focal .num { color: var(--bg); }
.style-terminal  .c-summary .card .num { font-size: 40px; font-variation-settings: 'opsz' 96, 'wght' 400; }
.style-editorial .c-summary .card .num { font-size: 44px; font-weight: 400; }
.style-modernist .c-summary .card .num { font-size: 48px; font-weight: 900; }
.style-institutional .c-summary .card .num { font-size: 48px; font-weight: 600; font-style: italic; }
.style-brutalist .c-summary .card .num { font-size: 52px; font-weight: 400; }

.c-summary .card .sub {
  font-family: var(--body-font);
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--fg-2);
  margin-top: auto;
}
.c-summary .card.focal .sub { color: var(--bg); opacity: 0.85; }
.style-modernist .c-summary .card.focal .sub,
.style-brutalist .c-summary .card.focal .sub { color: var(--bg); opacity: 1; }

/* ─── FUNNEL ─── */
.c-funnel {
  background: var(--bg-2);
  border: var(--rule-width) solid var(--rule);
  padding: 18px var(--pad);
}
.style-modernist .c-funnel { background: var(--bg); }
.style-brutalist .c-funnel { background: var(--bg-3); border-width: 3px; }

.c-funnel .head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: var(--rule-width) dashed var(--rule-2);
}
.c-funnel .head .t {
  font-family: var(--display-font);
  font-weight: 500;
  font-style: var(--display-italic);
  font-size: 16px;
  color: var(--fg);
  letter-spacing: -0.005em;
}
.style-modernist .c-funnel .head .t,
.style-brutalist .c-funnel .head .t { text-transform: uppercase; font-weight: 700; font-style: normal; font-size: 14px; letter-spacing: 0.02em; }
.style-institutional .c-funnel .head .t { font-style: italic; font-weight: 500; font-size: 18px; }
.c-funnel .head .t .a { color: var(--accent); }
.c-funnel .head .meta {
  font-family: var(--mono-font);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
}

.c-funnel .flow {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
  gap: 8px;
  align-items: stretch;
}
.c-funnel .stage {
  text-align: center;
  padding: 14px 10px;
  border: var(--rule-width) solid var(--rule-2);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.style-modernist .c-funnel .stage { background: var(--bg-2); }
.style-institutional .c-funnel .stage { background: var(--bg-3); }
.style-brutalist .c-funnel .stage { background: var(--bg); border-width: 2px; }
.c-funnel .stage .cnt {
  font-family: var(--display-font);
  font-weight: var(--display-weight);
  font-style: var(--display-italic);
  font-size: 30px;
  line-height: 1;
  color: var(--fg);
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.style-modernist .c-funnel .stage .cnt,
.style-brutalist .c-funnel .stage .cnt { font-weight: 700; font-style: normal; }
.c-funnel .stage .lab {
  font-family: var(--mono-font);
  font-size: 9px;
  color: var(--fg-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 1.4;
}
.c-funnel .step {
  padding: 8px 6px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-width: 110px;
}
.c-funnel .step .rate {
  font-family: var(--display-font);
  font-weight: 500;
  font-style: var(--display-italic);
  font-size: 18px;
  line-height: 1;
  color: var(--accent);
  letter-spacing: -0.01em;
}
.style-modernist .c-funnel .step .rate,
.style-brutalist .c-funnel .step .rate { font-weight: 700; font-style: normal; }
.c-funnel .step .how {
  font-family: var(--mono-font);
  font-size: 9px;
  color: var(--fg-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 2px;
}
.c-funnel .step .rc {
  font-family: var(--body-font);
  font-size: 10px;
  color: var(--fg-2);
  font-style: italic;
  margin-top: 4px;
  line-height: 1.35;
}
.style-modernist .c-funnel .step .rc,
.style-brutalist .c-funnel .step .rc { font-style: normal; font-weight: 500; }

/* ─── POSITION ─── */
.c-position {
  background: var(--bg-2);
  border: var(--rule-width) solid var(--rule);
  padding: var(--pad);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.style-modernist .c-position { background: var(--fg); color: var(--bg); border: none; }
.style-modernist .c-position * { color: var(--bg) !important; }
.style-modernist .c-position .acc { color: var(--accent) !important; }
.style-brutalist .c-position { background: var(--fg); color: var(--bg); border: none; }
.style-brutalist .c-position * { color: var(--bg) !important; }

.layout-mag .c-position {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) 1.4fr;
  gap: 28px;
  align-items: stretch;
}
.layout-mag .c-position .lead { display: flex; flex-direction: column; gap: 10px; }
.layout-mag .c-position .buys {
  margin-top: 0;
  padding-top: 0;
  padding-left: 28px;
  border-top: none;
  border-left: var(--rule-width) dashed var(--rule-2);
}

.c-position .label {
  font-family: var(--mono-font);
  font-size: 9.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.style-modernist .c-position .label,
.style-brutalist .c-position .label { color: var(--accent) !important; }

.c-position .big {
  font-family: var(--display-font);
  font-weight: var(--display-weight);
  font-style: var(--display-italic);
  line-height: 0.95;
  letter-spacing: -0.04em;
  color: var(--warn);
  margin: 2px 0;
}
.style-terminal  .c-position .big { font-size: 64px; font-variation-settings: 'opsz' 96, 'wght' 300; }
.style-editorial .c-position .big { font-size: 56px; color: var(--accent); font-weight: 300; }
.style-modernist .c-position .big { font-size: 68px; font-weight: 900; color: var(--accent) !important; text-transform: uppercase; }
.style-institutional .c-position .big { font-size: 56px; font-weight: 600; color: var(--accent); font-style: italic; }
.style-brutalist .c-position .big { font-size: 70px; font-weight: 400; color: var(--accent) !important; line-height: 0.85; }

.c-position .sub {
  font-family: var(--body-font);
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--fg-2);
}
.c-position .sub .v { color: var(--fg); font-weight: 500; }
.c-position .sub .n { font-family: var(--mono-font); font-weight: 500; color: var(--fg); }

.c-position .buys { margin-top: 4px; padding-top: 12px; border-top: var(--rule-width) dashed var(--rule-2); }
.style-modernist .c-position .buys,
.style-brutalist .c-position .buys { border-top-color: var(--accent); }
.c-position .buys .label { margin-bottom: 8px; }
.c-position .buys ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.c-position .buys li {
  font-family: var(--body-font);
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  border-bottom: var(--rule-width) dashed var(--rule);
}
.style-modernist .c-position .buys li,
.style-brutalist .c-position .buys li { border-bottom-color: var(--fg-3); }
.c-position .buys li:last-child { border-bottom: none; }
.c-position .buys li .tag { font-family: var(--mono-font); color: var(--fg-3); font-size: 9.5px; letter-spacing: 0.04em; }
.c-position .buys .plus { color: var(--accent); font-weight: 600; margin-right: 6px; }
.c-position .buys .x { color: var(--warn); font-weight: 600; margin-right: 6px; }
.style-modernist .c-position .buys .x { color: var(--bg) !important; }
.style-brutalist .c-position .buys .x { color: var(--accent) !important; }

/* ─── CHART ─── */
.c-chart {
  background: var(--bg-2);
  border: var(--rule-width) solid var(--rule);
  padding: 14px 18px 16px;
  display: flex;
  flex-direction: column;
}
.style-modernist .c-chart { background: var(--bg); }
.style-brutalist .c-chart { background: var(--bg); border-width: 3px; }

.c-chart .head { padding-bottom: 14px; margin-bottom: 6px; border-bottom: var(--rule-width) dashed var(--rule-2); }
.c-chart .head .t {
  font-family: var(--display-font);
  font-weight: 500;
  font-style: var(--display-italic);
  font-size: 18px;
  letter-spacing: -0.01em;
  color: var(--fg);
  line-height: 1.2;
  margin-bottom: 4px;
}
.style-modernist .c-chart .head .t,
.style-brutalist .c-chart .head .t { font-weight: 700; text-transform: uppercase; font-style: normal; font-size: 15px; letter-spacing: 0.02em; }
.style-institutional .c-chart .head .t { font-style: italic; font-weight: 500; font-size: 20px; }
.c-chart .head .t .a { color: var(--accent); }
.c-chart .head .conclusion { font-family: var(--body-font); font-size: 12px; color: var(--fg); line-height: 1.45; }
.style-modernist .c-chart .head .conclusion,
.style-brutalist .c-chart .head .conclusion { font-weight: 500; }
.c-chart .head .conclusion .em { color: var(--accent); font-weight: 600; }
.style-modernist .c-chart .head .conclusion .em,
.style-brutalist .c-chart .head .conclusion .em { background: var(--accent); color: var(--bg); padding: 1px 6px; }

/* SVG chart internals */
.pnl { display: block; width: 100%; height: auto; flex: 1; }
.pnl .grid-h { stroke: var(--rule); stroke-width: 0.5; stroke-dasharray: 2 4; }
.pnl .zero { stroke: var(--fg-3); stroke-width: 1; opacity: 0.6; }
.pnl .ax-text { font-family: var(--mono-font); font-size: 10px; fill: var(--fg-2); letter-spacing: 0.04em; }
.pnl .ax-zero { font-family: var(--mono-font); font-size: 10px; fill: var(--fg); font-weight: 600; }
.pnl .range { fill: var(--accent); opacity: 0.10; }
.pnl .l-mid { stroke: var(--accent); stroke-width: 2.6; fill: none; }
.pnl .l-cons { stroke: var(--accent); stroke-width: 1; fill: none; opacity: 0.35; stroke-dasharray: 3 3; }
.pnl .l-opt  { stroke: var(--accent); stroke-width: 1; fill: none; opacity: 0.35; stroke-dasharray: 3 3; }
.pnl .be { fill: var(--accent); }
.pnl .be-text { font-family: var(--mono-font); font-size: 10px; fill: var(--accent); font-weight: 600; letter-spacing: 0.08em; }
.pnl .lbl-mid  { font-family: var(--mono-font); font-size: 11.5px; fill: var(--accent); font-weight: 600; }
.pnl .lbl-edge { font-family: var(--mono-font); font-size: 10px; fill: var(--accent); opacity: 0.6; font-weight: 500; }
.pnl .lbl-name { font-family: var(--mono-font); font-size: 9px; fill: var(--fg-3); letter-spacing: 0.14em; }
.style-modernist .pnl .l-mid { stroke-width: 4; }
.style-modernist .pnl .range { opacity: 0.15; }
.style-modernist .pnl .grid-h { stroke: #CCC; }
.style-modernist .pnl .be { fill: var(--fg); }
.style-modernist .pnl .be-text { fill: var(--fg); font-weight: 700; }
.style-modernist .pnl .zero { stroke: var(--fg); stroke-width: 2; opacity: 1; }
.style-modernist .pnl .ax-zero { fill: var(--fg); font-weight: 700; }
.style-institutional .pnl .grid-h { stroke: #2A3F65; stroke-width: 0.4; }
.style-institutional .pnl .zero { stroke: var(--fg); opacity: 0.5; }
.style-institutional .pnl .range { opacity: 0.12; }
.style-brutalist .pnl .l-mid { stroke-width: 4.5; }
.style-brutalist .pnl .l-cons, .style-brutalist .pnl .l-opt { stroke-width: 2; stroke-dasharray: 4 3; opacity: 0.5; }
.style-brutalist .pnl .range { opacity: 0.13; }
.style-brutalist .pnl .grid-h { stroke: #888; opacity: 0.3; }
.style-brutalist .pnl .zero { stroke: var(--fg); stroke-width: 2.5; opacity: 1; }
.style-brutalist .pnl .be { fill: var(--accent); stroke: var(--fg); stroke-width: 1.5; }
.style-editorial .pnl .l-mid { stroke: var(--accent); stroke-width: 2.2; }
.style-editorial .pnl .range { opacity: 0.12; }

/* ─── SCENARIOS ─── */
.c-scenarios {
  background: var(--bg-2);
  border: var(--rule-width) solid var(--rule);
  padding: 0;
  display: flex;
  flex-direction: column;
}
.style-modernist .c-scenarios { background: var(--bg); }
.style-brutalist .c-scenarios { background: var(--bg); border-width: 3px; }

.c-scenarios .head {
  padding: 14px var(--pad) 12px;
  border-bottom: var(--rule-width) solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.c-scenarios .head .t {
  font-family: var(--display-font);
  font-style: var(--display-italic);
  font-weight: 500;
  font-size: 15px;
  color: var(--fg);
  letter-spacing: -0.005em;
}
.style-modernist .c-scenarios .head .t,
.style-brutalist .c-scenarios .head .t { font-weight: 700; text-transform: uppercase; font-style: normal; font-size: 13px; letter-spacing: 0.02em; }
.style-institutional .c-scenarios .head .t { font-style: italic; font-weight: 500; font-size: 17px; }
.c-scenarios .head .t .a { color: var(--accent); }
.c-scenarios .head .meta { font-family: var(--mono-font); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); }

.c-scenarios .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); }
.c-scenarios .sc { padding: 16px 16px 18px; border-right: var(--rule-width) solid var(--rule); }
.c-scenarios .sc:last-child { border-right: none; }

.c-scenarios .sc .name {
  font-family: var(--display-font);
  font-style: var(--display-italic);
  font-weight: 500;
  font-size: 14px;
  color: var(--fg);
  margin-bottom: 14px;
}
.style-modernist .c-scenarios .sc .name,
.style-brutalist .c-scenarios .sc .name { text-transform: uppercase; font-weight: 700; font-style: normal; font-size: 12px; letter-spacing: 0.04em; }
.c-scenarios .sc .pb-l { font-family: var(--mono-font); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 1px; }
.c-scenarios .sc .pb {
  font-family: var(--display-font);
  font-weight: 600;
  font-style: var(--display-italic);
  font-size: 28px;
  line-height: 1;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}
.style-modernist .c-scenarios .sc .pb,
.style-brutalist .c-scenarios .sc .pb { font-weight: 900; font-style: normal; }
.c-scenarios .sc .m24-l { font-family: var(--mono-font); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 1px; }
.c-scenarios .sc .m24 { font-family: var(--mono-font); font-size: 18px; font-weight: 500; line-height: 1; margin-bottom: 10px; }
.c-scenarios .sc .lev { font-family: var(--mono-font); font-size: 9.5px; color: var(--fg-3); letter-spacing: 0.04em; }

.sc-cons .pb, .sc-cons .m24 { color: var(--accent-dim); }
.sc-mid  .pb, .sc-mid  .m24 { color: var(--accent); }
.sc-opt  .pb, .sc-opt  .m24 { color: var(--accent); }
.sc-mid { background: rgba(200,255,0,0.04); }
.style-editorial  .sc-mid { background: rgba(200,20,26,0.04); }
.style-modernist  .sc-mid { background: rgba(255,69,0,0.05); }
.style-institutional .sc-mid { background: rgba(212,175,55,0.06); }
.style-brutalist  .sc-mid { background: rgba(212,0,0,0.05); }

.layout-mag .c-scenarios .grid-3,
.layout-brief .c-scenarios .grid-3 { grid-template-columns: 1fr; flex: 1; display: flex; flex-direction: column; }
.layout-mag .c-scenarios .sc,
.layout-brief .c-scenarios .sc { flex: 1; border-right: none; border-bottom: var(--rule-width) solid var(--rule); display: flex; flex-direction: column; justify-content: center; }
.layout-mag .c-scenarios .sc:last-child,
.layout-brief .c-scenarios .sc:last-child { border-bottom: none; }
.layout-mag .c-scenarios .sc .pb,
.layout-brief .c-scenarios .sc .pb { font-size: 32px; margin-bottom: 8px; }
.layout-mag .c-scenarios .sc .m24,
.layout-brief .c-scenarios .sc .m24 { font-size: 16px; margin-bottom: 8px; }

/* ─── EXECUTION ─── */
.c-execution {
  background: var(--bg-2);
  border: var(--rule-width) solid var(--rule);
  padding: var(--pad);
}
.style-modernist .c-execution { background: var(--bg); }
.style-brutalist .c-execution { background: var(--bg-2); border-width: 3px; }

.c-execution .head { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; }
.c-execution .head .t {
  font-family: var(--display-font);
  font-style: var(--display-italic);
  font-weight: 500;
  font-size: 15px;
  color: var(--fg);
  letter-spacing: -0.005em;
}
.style-modernist .c-execution .head .t,
.style-brutalist .c-execution .head .t { font-weight: 700; text-transform: uppercase; font-style: normal; font-size: 13px; letter-spacing: 0.02em; }
.style-institutional .c-execution .head .t { font-style: italic; font-weight: 500; font-size: 17px; }
.c-execution .head .meta { font-family: var(--mono-font); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); }
.c-execution .phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.c-execution .ph { padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--bg-3); }
.style-brutalist .c-execution .ph { background: var(--bg); border-left-width: 4px; }
.c-execution .ph .lab { font-family: var(--mono-font); font-size: 9.5px; letter-spacing: 0.18em; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
.c-execution .ph .lab .w { color: var(--fg-3); font-weight: 400; }
.c-execution .ph .nm {
  font-family: var(--display-font);
  font-style: var(--display-italic);
  font-weight: 500;
  font-size: 13.5px;
  color: var(--fg);
  margin-bottom: 5px;
}
.style-modernist .c-execution .ph .nm,
.style-brutalist .c-execution .ph .nm { font-weight: 700; text-transform: uppercase; font-style: normal; font-size: 12px; }
.c-execution .ph .bd { font-family: var(--body-font); font-size: 10.5px; line-height: 1.5; color: var(--fg-2); }
.c-execution .ph .bd .v { color: var(--fg); font-weight: 500; }
.c-execution .ph .bd .a { color: var(--accent); font-weight: 500; }

/* ─── FOOTER ─── */
.c-footer {
  padding-top: 12px;
  border-top: var(--rule-width) solid var(--rule-2);
